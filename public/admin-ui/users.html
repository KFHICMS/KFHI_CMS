<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff · KFHI Admin</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">KFHI<span>.</span></div>
    <nav class="nav"><a href="users.html" class="active">Staff</a></nav>
  </aside>

  <div class="main">
    <div class="topbar">
      <input type="search" id="search" placeholder="Search name, email, employee no or position" maxlength="100">
      <span class="spacer"></span>
      <span class="who" id="who"></span>
      <button class="btn" id="logoutBtn" type="button">Log out</button>
    </div>

    <div class="page-head">
      <h1><b id="count">…</b> Staff</h1>
      <span class="spacer"></span>
      <button class="btn" id="filterBtn" type="button">Filter</button>
      <a class="btn btn-primary" href="user-form.html">+ Add Staff</a>
    </div>

    <div class="filters" id="filters" hidden>
      <label>Role
        <select id="roleFilter"><option value="">All roles</option></select>
      </label>
      <label>Status
        <select id="statusFilter">
          <option value="">All</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </label>
    </div>

    <div id="msg" class="alert error" hidden></div>
    <div class="grid" id="grid"></div>
    <div class="pager" id="pager" hidden>
      <button class="btn" id="prev" type="button">Previous</button>
      <span id="pageInfo"></span>
      <button class="btn" id="next" type="button">Next</button>
    </div>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const state = { page: 1, search: '', role: '', status: '' };
  let lastRequest = 0;

  function card(u) {
    const sp = u.staff_profile;
    return el('a', { class: 'staff-card' + (u.is_active ? '' : ' inactive'), href: adminPageUrl('user.html', { id: u.id }) },
      el('div', { class: 'avatar-wrap' },
        avatar(u),
        el('span', { class: 'dot ' + (u.is_active ? 'on' : 'off'), title: u.is_active ? 'Active' : 'Inactive' })),
      el('div', { class: 'name' }, u.name, u.is_active ? null : el('span', { class: 'badge' }, 'Inactive')),
      el('div', { class: 'pos' }, sp ? sp.position : roleLabel(u.role)),
      el('div', { class: 'facts' },
        el('div', {}, el('small', {}, 'Role'), el('b', {}, roleLabel(u.role))),
        el('div', {}, el('small', {}, 'Joined'), el('b', {}, sp ? formatDate(sp.joined_date) : '—'))),
      el('div', { class: 'line' }, '✉ ' + u.email),
      el('div', { class: 'line' }, '☎ ' + (sp ? sp.phone : '—')));
  }

  async function load() {
    const myRequest = ++lastRequest;
    const qs = new URLSearchParams({ page: state.page, per_page: 12 });
    if (state.search) qs.set('search', state.search);
    if (state.role) qs.set('role', state.role);
    if (state.status) qs.set('status', state.status);

    $('msg').hidden = true;
    $('grid').replaceChildren(el('div', { class: 'empty' }, 'Loading…'));

    try {
      const res = await api('/admin/users?' + qs);
      if (myRequest !== lastRequest) return;          // an newer search already started

      $('count').textContent = res.meta.total;
      $('grid').replaceChildren(
        ...(res.data.length ? res.data.map(card) : [el('div', { class: 'empty' }, 'No staff found.')]));

      $('pager').hidden = res.meta.last_page <= 1;
      $('pageInfo').textContent = `Page ${res.meta.current_page} of ${res.meta.last_page}`;
      $('prev').disabled = res.meta.current_page <= 1;
      $('next').disabled = res.meta.current_page >= res.meta.last_page;
    } catch (err) {
      if (myRequest !== lastRequest) return;
      $('grid').replaceChildren();
      $('msg').textContent = errorText(err);
      $('msg').hidden = false;
    }
  }

  (async function init() {
    const me = await requireAdmin();
    if (!me) return;
    $('who').textContent = me.name;

    for (const [value, label] of Object.entries(ROLES)) {
      $('roleFilter').append(el('option', { value }, label));
    }

    let timer;
    $('search').addEventListener('input', (e) => {
      clearTimeout(timer);                               // wait until the user stops typing
      timer = setTimeout(() => { state.search = e.target.value.trim(); state.page = 1; load(); }, 350);
    });
    $('roleFilter').addEventListener('change', (e) => { state.role = e.target.value; state.page = 1; load(); });
    $('statusFilter').addEventListener('change', (e) => { state.status = e.target.value; state.page = 1; load(); });
    $('filterBtn').addEventListener('click', () => { $('filters').hidden = !$('filters').hidden; });
    $('prev').addEventListener('click', () => { state.page--; load(); });
    $('next').addEventListener('click', () => { state.page++; load(); });
    $('logoutBtn').addEventListener('click', logout);

    load();
  })();
</script>
</body>
</html>
